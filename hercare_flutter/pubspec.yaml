name: hercare
description: HerCare – Postpartum Depression Early Screening, Monitoring & Intervention
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  provider: ^6.1.1

  # Navigation
  go_router: ^13.2.1

  # HTTP & API
  dio: ^5.4.3
  pretty_dio_logger: ^1.3.1

  # Secure storage (tokens, sensitive data)
  flutter_secure_storage: ^9.0.0

  # Local storage (preferences)
  shared_preferences: ^2.2.2

  # Environment config
  flutter_dotenv: ^5.1.0

  # Input validation
  form_validator: ^2.1.1

  # Animations
  lottie: ^3.1.0
  animate_do: ^3.3.4

  # Phone number input (for OTP auth)
  intl_phone_field: ^3.2.0

  # Internationalization
  intl: ^0.20.2

  # UI enhancements
  flutter_svg: ^2.0.10+1
  google_fonts: ^6.2.1
  smooth_page_indicator: ^1.1.0
  step_progress_indicator: ^1.0.2
  pinput: ^4.0.0

  # Icons
  iconsax: ^0.0.8
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.8

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - .env

