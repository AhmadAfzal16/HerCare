name: hercare
description: HerCare – Postpartum Depression Early Screening, Monitoring & Intervention
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  provider: ^6.1.1

  # Navigation
  go_router: ^13.2.1

  # HTTP & API
  dio: ^5.4.3

  # Secure storage (tokens, sensitive data)
  flutter_secure_storage: ^9.0.0

  # Local storage (preferences)
  shared_preferences: ^2.2.2

  # Environment config
  flutter_dotenv: ^5.1.0

  # Internationalization
  intl: ^0.20.2

  # Typography
  google_fonts: ^6.2.1
  record: ^7.1.1
  path_provider: ^2.1.6
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  file_picker: 10.3.10
  just_audio: 0.10.6
  camera: 0.12.2
  audio_session: 0.2.4
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/crisis_contacts.json
    - assets/care_facilities.json
    - assets/audio/crisis/
    - assets/meditation_guides.json
    - assets/audio/meditation/
    - assets/audio/breathing/
    # Nunito (SIL Open Font License, see google_fonts/OFL.txt), bundled so the
    # app font works offline; google_fonts loads these files instead of
    # downloading them.
    - google_fonts/
    - .env
